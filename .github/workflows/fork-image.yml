name: Fork patched image

# Publishes an integration branch of a fork (an official build commit plus
# merged pull requests) to ghcr.io/<fork owner>/silo-server. Upstream's
# docker.yml and trusted-linux-build.yml publish only from
# Silo-Server/silo-server main and apiv2, so this mirrors their build steps:
# the same Dockerfile, build arguments and OCI labels, with an empty build
# number as upstream uses off the default branch. It never tags latest or
# build-N. The vpl variant sets the Dockerfile's INTEL_QSV_RUNTIME=vpl.
# A push trigger is needed because workflow_dispatch only finds workflows
# on the default branch, and this file never lands on the fork's main.
on:
  push:
    branches: ['integration/**']
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  prepare:
    name: Prepare build identity
    if: >-
      github.repository != 'Silo-Server/silo-server' &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      built_at: ${{ steps.identity.outputs.built_at }}
      image_version: ${{ steps.identity.outputs.image_version }}
    steps:
      - name: Resolve build identity
        id: identity
        run: |
          {
            echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "image_version=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: general, qsv_runtime: auto, platform: linux/amd64 }
          - { variant: general, qsv_runtime: auto, platform: linux/arm64 }
          - { variant: vpl, qsv_runtime: vpl, platform: linux/amd64 }
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare platform slug and lowercase image name
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DIRTY=false
            BUILD_NUMBER=
            BUILD_DATE=${{ needs.prepare.outputs.built_at }}
            INTEL_QSV_RUNTIME=${{ matrix.qsv_runtime }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: general, suffix: "" }
          - { variant: vpl, suffix: "-vpl" }
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prepare lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ github.sha }}${{ matrix.suffix }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_LC}:${TAG}" \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)

      - name: Inspect manifest list
        env:
          TAG: ${{ github.sha }}${{ matrix.suffix }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${TAG}"
          {
            echo "### ${{ matrix.variant }} image"
            echo
            echo '```'
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${TAG}" --format '{{json .Manifest}}' | jq -r '"\(.digest) \(.mediaType)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
